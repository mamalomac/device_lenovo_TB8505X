name: Build OrangeFox (TB-8505X)

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: "Name shown in OrangeFox"
        required: false
        default: "Unofficial"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FOX_PATH: ${{ github.workspace }}/fox
      DEVICE_PATH: device/lenovo/TB8505X
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo apt-get -qq clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 libncurses6 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python-is-python3 rsync bc ccache
          L=/usr/lib/x86_64-linux-gnu
          sudo ln -sf $L/libncurses.so.6 $L/libncurses.so.5
          sudo ln -sf $L/libtinfo.so.6 $L/libtinfo.so.5
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "github-actions"
          git config --global user.email "actions@users.noreply.github.com"

      - name: Sync OrangeFox fox_12.1 (minimal)
        run: |
          git clone --depth 1 https://gitlab.com/OrangeFox/sync.git ~/fox_sync
          cd ~/fox_sync
          ./orangefox_sync.sh --branch 12.1 --path "$FOX_PATH"

      - name: Add device tree
        uses: actions/checkout@v4
        with:
          path: fox/${{ env.DEVICE_PATH }}

      - name: Build
        run: |
          cd "$FOX_PATH"
          set +e
          source build/envsetup.sh
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=TB8505X
          export OF_MAINTAINER="${{ github.event.inputs.maintainer }}"
          lunch twrp_TB8505X-eng
          mka adbd recoveryimage

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-TB8505X
          path: |
            fox/out/target/product/TB8505X/OrangeFox*.img
            fox/out/target/product/TB8505X/OrangeFox*.zip
            fox/out/target/product/TB8505X/recovery.img
          if-no-files-found: error
